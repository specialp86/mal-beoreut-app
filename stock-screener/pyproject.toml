[project]
name = "stock-screener"
version = "0.1.0"
description = "전일 종목 스크리닝 + 매매 시나리오 리포트 생성기"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
