# Stage 4 갭 구간별 시나리오 규칙. 스펙 5.1 기본값.
# gap_pct는 "전일 종가 대비 당일 시가 갭 %" 기준 하한(min) / 상한(max, 없으면 무한대).
# 각 구간의 공식은 scenario.py 의 GapRule 계산 로직과 1:1 대응한다.

gap_bands:
  - id: lock_limit_up
    label: "점상한가 (+30% 근접)"
    min_gap_pct: 27.0
    max_gap_pct: null
    verdict: "진입 불가"
    entry_condition: "매수 불가, 관망만"
    tradeable: false

  - id: chase_forbidden
    label: "+10~30%"
    min_gap_pct: 10.0
    max_gap_pct: 27.0
    verdict: "추격 금지"
    entry_condition: "초반 눌림 후 거래량 감소 동반 지지 확인 시만 소량"
    tradeable: true
    stop_loss:
      basis: entry_price
      multiplier: 0.97
    take_profit:
      basis: entry_price
      multiplier_min: 1.03
      multiplier_max: 1.05

  - id: normal_gap_up
    label: "+3~10%"
    min_gap_pct: 3.0
    max_gap_pct: 10.0
    verdict: "정상 갭상승"
    entry_condition: "09:00~09:10 고점(ORB 상단) 거래량 동반 돌파 시"
    tradeable: true
    stop_loss:
      basis: open_price
      multiplier_strong_material: 0.96   # 재료강도 '강'
      multiplier_default: 0.97
    take_profit:
      basis: stop_loss_distance
      multiplier_min: 1.5
      multiplier_max: 1.7

  - id: watch_flat
    label: "-3~+3%"
    min_gap_pct: -3.0
    max_gap_pct: 3.0
    verdict: "방향성 관망"
    entry_condition: "전일 종가선 거래량 동반 지지 확인 시"
    tradeable: true
    stop_loss:
      basis: prev_close
      multiplier: 0.97
    take_profit:
      basis: stop_loss_distance
      multiplier: 1.5

  - id: thesis_impaired
    label: "-3~-10%"
    min_gap_pct: -10.0
    max_gap_pct: -3.0
    verdict: "근거 훼손 가능"
    entry_condition: "반등 시도 확인 시만 소량"
    tradeable: true
    stop_loss:
      basis: open_price
      multiplier: 0.975
    take_profit:
      basis: open_price
      multiplier: 1.025

  - id: hold_off
    label: "-10% 이하"
    min_gap_pct: null
    max_gap_pct: -10.0
    verdict: "매매 보류"
    entry_condition: "진입 안 함"
    tradeable: false
    note: "뉴스 재확인 필요"

# 공통 규칙 (모든 종목/리포트 상단에 삽입)
common_rules:
  market_gate: "당일 코스피/코스닥 지수가 -1% 이상 하락 출발 시, 전 종목 진입 강도 한 단계 하향 (비중 축소 또는 진입 보류)"
  time_cutoff: "목표가 미도달이어도 09:30 전량 정리 (예외 없음)"
  no_reentry: "손절 발생 종목은 당일 재진입 금지"
  volume_confirmation: "모든 진입 조건은 '가격 조건 + 거래량 동반' 동시 충족 시에만 유효"

# 종목별 조정 로직 (5.3)
adjustments:
  strong_material_stop_loss_relief_pct: 4.0   # 재료강도 '강'일 때 손절폭 기본 -4%까지 여유
  small_cap_high_volatility_stop_loss_tight_pct: 2.0  # 소형/고변동 종목 손절폭 타이트하게
  small_cap_market_cap_threshold_krw: 300_000_000_000  # 시가총액 3000억 미만을 소형주로 간주 (조정 가능)
  high_volatility_atr_pct_threshold: 8.0  # 최근 변동성(ATR%)이 이 값 이상이면 '변동성 큰 종목'
