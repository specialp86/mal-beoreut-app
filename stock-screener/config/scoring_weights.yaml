# Stage 2 스코어링 가중치 (합계 100점). 스펙 3.1 기본값.
# 실매매 결과를 바탕으로 조정할 때는 이 파일만 수정하면 된다.

weights:
  trading_value_rank: 25   # 거래대금 순위 (시장 전체 대비 백분위)
  candle_shape: 20         # 캔들모양(윗꼬리 비율)
  supply_demand: 20        # 수급 (외국인·기관 양매수)
  ma_alignment: 15         # 이평선 정배열 (5일선·20일선 위 마감)
  after_hours: 10          # 시간외 단일가 반응
  material_strength: 10    # 재료 강도 (Stage 3 결과 반영)

# 필터링 기준
top_n: 10                  # Stage 3로 전달할 상위 종목 수
min_score: 60               # 이 점수 미만은 필터링에서 제외 (top_n과 별개로 최소선 적용)

# 권장 비중 산출 규칙
position_sizing:
  - min_score: 80
    requires_material_strength: strong   # 재료강도 '강' 요구
    weight_pct: 100
  - min_score: 60
    requires_material_strength: null
    weight_pct: 70
  - min_score: 0
    requires_material_strength: null
    weight_pct: 0            # 60점 미만: 관망 (리포트 미포함)

# 재료 강도별 점수 매핑 (material_strength 배점 10점 만점 환산용)
material_strength_points:
  strong: 10
  medium: 5
  weak: 2
  none: 0

# 항목별 스코어 산출 시 사용하는 스케일링 파라미터
scaling:
  after_hours_full_score_pct: 5.0   # 시간외 단일가 상승률이 이 값 이상이면 만점

